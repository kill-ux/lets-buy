spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: lets-play-api
  mongodb:
    host: ${MONGO_HOST}
    port: ${MONGO_PORT}
    database: ${MONGO_DATABASE}
    username: ${MONGO_INITDB_ROOT_USERNAME}
    password: ${MONGO_INITDB_ROOT_PASSWORD}
    authentication-database: admin